server:
  port: ${PORT:8080}

spring:
  application:
    name: music-catalog-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/music-catalog;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: change-this-development-secret-to-a-long-random-value-1234567890
    expiration-minutes: 120
  itunes:
    base-url: https://itunes.apple.com
  gemini:
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
