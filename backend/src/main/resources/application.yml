spring:
  application:
    name: music-catalog-api
  datasource:
    url: jdbc:h2:file:./data/music-catalog;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: change-this-development-secret-to-a-long-random-value-1234567890
    expiration-minutes: 120
  itunes:
    base-url: https://itunes.apple.com
